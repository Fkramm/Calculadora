<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .fundo {
            background-image: url("./images/fundo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            height: 100vh;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .fundo > h1 {
            padding-top: 25px;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #aaa;
        }

        .calculadora {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.88);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 22px;

            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        .calculadora h1 {
            font-size: 25px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #f5f5f5;
            text-shadow: 0 0 8px #aaa;
        }

        #resultado {
            background-color: #111;
            width: 226px;
            height: 45px;
            margin: 5px auto 15px;

            font-size: 25px;
            color: white;
            text-align: right;
            padding: 8px;

            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 8px #000;
        }

        .botao {
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            margin: 3px;

            background-color: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;

            transition: 0.2s;
        }

        .botao:hover {
            background-color: #383838;
            border-color: #aaa;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .botao:active {
            transform: scale(0.95);
        }

        /* Botões de operações */

        .operador {
            background-color: #292929;
            color: #d5d5d5;
            border-color: #555;
        }

        /* Botão de resultado */

        .igual {
            background-color: #444;
            border-color: #888;
            font-size: 25px;
        }

        .igual:hover {
            background-color: #666;
        }

        /* Botão de limpar */

        .limpar {
            color: #aaa;
            border-color: #555;
        }

    </style>
</head>

<body>

    <div class="fundo">

        <h1>Flávia Kramm</h1>

        <div class="calculadora">

            <h1>⭑ Calculadora ⭑</h1>

            <p id="resultado"></p>

            <table>
                <tr>
                    <td><button class="botao limpar" onclick="clean()">C</button></td>
                    <td><button class="botao operador" onclick="back()">&lt;</button></td>
                    <td><button class="botao operador" onclick="insert('/')">/</button></td>
                    <td><button class="botao operador" onclick="insert('*')">X</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('7')">7</button></td>
                    <td><button class="botao" onclick="insert('8')">8</button></td>
                    <td><button class="botao" onclick="insert('9')">9</button></td>
                    <td><button class="botao operador" onclick="insert('-')">-</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('4')">4</button></td>
                    <td><button class="botao" onclick="insert('5')">5</button></td>
                    <td><button class="botao" onclick="insert('6')">6</button></td>
                    <td><button class="botao operador" onclick="insert('+')">+</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('1')">1</button></td>
                    <td><button class="botao" onclick="insert('2')">2</button></td>
                    <td><button class="botao" onclick="insert('3')">3</button></td>
                    <td rowspan="2">
                        <button class="botao igual" style="height: 106px;" onclick="calcular()">=</button>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <button class="botao" style="width: 106px;" onclick="insert('0')">0</button>
                    </td>
                    <td><button class="botao" onclick="insert('.')">.</button></td>
                </tr>

            </table>
        </div>
    </div>

    <script>
        function insert(num) {
            var numero = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = numero + num;
        }

        function clean() {
            document.getElementById('resultado').innerHTML = "";
        }

        function back() {
            var resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML =
                resultado.substring(0, resultado.length - 1);
        }

        function calcular() {
            var resultado = document.getElementById('resultado').innerHTML;

            if (resultado) {
                document.getElementById('resultado').innerHTML = eval(resultado);
            } else {
                document.getElementById('resultado').innerHTML = "Nada...";
            }
        }
    </script>

</body>
</html>
